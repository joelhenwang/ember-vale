[project]
name = "ember-vale-local-models"
version = "0.1.0"
description = "Local embeddings (OpenVINO) and entity extraction (GLiNER2.5) for Ember Vale"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "numpy>=2.0",
  "openvino>=2026.0",
  "transformers>=4.57,<5",
  "tokenizers>=0.22",
  "torch>=2.6",
  "gliner2>=2.0",
  "peft",
  "protobuf",
  "sentencepiece",
  "tiktoken",
]

[project.optional-dependencies]
# Only needed once, to turn the Hugging Face model into OpenVINO IR.
export = [
  "optimum[openvino]>=2.0",
  "nncf>=3.0",
  # optimum-intel's export still calls SentenceTransformer._text_length.
  "sentence-transformers==5.1.2",
]
dev = ["pytest>=8", "httpx>=0.27"]

[tool.uv]
package = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["local_models"]

[tool.pytest.ini_options]
testpaths = ["tests"]

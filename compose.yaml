# Ember Vale compose — isolated from any PixelSaga installation.
# Distinct database (embervale), volume (pgdata-embervale) and ports
# (db 5433, api 8101). Never point this at an old production database.
services:
  db:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    # pg_stat_statements: per-query timings for performance work
    # (docs/evidence/perf-infra-001); query it with
    #   select calls, mean_exec_time, query from pg_stat_statements order by total_exec_time desc
    command:
      - postgres
      - -c
      - shared_preload_libraries=pg_stat_statements
      - -c
      - pg_stat_statements.track=top
      # Room for WORLDSIM_APP__WORKERS=N API processes plus the worker
      # (WORLDSIM_DATABASE__CONNECTION_BUDGET, perf-reads-001).
      - -c
      - max_connections=200
      - -c
      - pg_stat_statements.max=5000
    env_file:
      - path: .env
        required: false
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-embervale}
      POSTGRES_USER: ${POSTGRES_USER:-embervale}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme-local-only}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - pgdata-embervale:/var/lib/postgresql/data
      - ./backend/docker/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-embervale} -d $${POSTGRES_DB:-embervale}"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - path: .env
        required: false
    environment:
      WORLDSIM_APP__HOST: "0.0.0.0"
      WORLDSIM_APP__PORT: "8000"
      WORLDSIM_DATABASE__URL: "postgresql+asyncpg://${POSTGRES_USER:-embervale}:${POSTGRES_PASSWORD:-changeme-local-only}@db:5432/${POSTGRES_DB:-embervale}"
      WORLDSIM_SECURITY__PUBLIC_BIND_ALLOW: "${WORLDSIM_SECURITY__PUBLIC_BIND_ALLOW:-false}"
      WORLDSIM_SECURITY__API_KEY: "${WORLDSIM_SECURITY__API_KEY:-}"
    ports:
      - "${API_PORT:-8101}:8000"
    volumes:
      # Generated portraits and place art outlive container rebuilds.
      - generated-embervale:/app/content/assets/generated
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health/live')\""]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  # Backups of the database and the painted pictures into ./backups on this
  # disk, outside Docker's volumes: at start when the newest is a day old,
  # then daily; the newest 7 are kept (backend/docker/backup/backup.sh).
  # Restore with scripts/restore-backup.sh or the launcher.
  backup:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - path: .env
        required: false
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-embervale}
      POSTGRES_USER: ${POSTGRES_USER:-embervale}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme-local-only}
      PGHOST: db
    entrypoint: ["sh", "/backup.sh"]
    command: ["loop"]
    volumes:
      - ./backend/docker/backup/backup.sh:/backup.sh:ro
      - ./backups:/backups
      - generated-embervale:/generated

  # Opt-in (`docker compose --profile scale up -d`): autoplay, painting and
  # local-model indexing in their own process. Pair it with
  # WORLDSIM_APP__BACKGROUND_LOOPS=false and WORLDSIM_APP__WORKERS=N on the
  # api service to serve HTTP from several processes.
  worker:
    profiles: ["scale"]
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    env_file:
      - path: .env
        required: false
    environment:
      WORLDSIM_DATABASE__URL: "postgresql+asyncpg://${POSTGRES_USER:-embervale}:${POSTGRES_PASSWORD:-changeme-local-only}@db:5432/${POSTGRES_DB:-embervale}"
    entrypoint: ["python", "-m", "worldsim.interfaces.worker"]
    volumes:
      - generated-embervale:/app/content/assets/generated

volumes:
  pgdata-embervale:
  generated-embervale:

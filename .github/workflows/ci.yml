name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm test

  backend:
    runs-on: ubuntu-latest
    services:
      db:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: embervale
          POSTGRES_USER: embervale
          POSTGRES_PASSWORD: ci-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U embervale -d embervale"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Explicit test configuration: never the live provider, never the
      # tracked evidence directories (stage gates write there by default).
      WORLDSIM_DATABASE__URL: postgresql+asyncpg://embervale:ci-only@localhost:5432/embervale
      WORLDSIM_PROVIDER__ACTIVE_PROFILE: fake
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          python-version: "3.12"
          enable-cache: true
      - run: echo "WORLDSIM_EVIDENCE_DIR=$RUNNER_TEMP/evidence" >> "$GITHUB_ENV"
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      # Strict for src; tests relax only private-access and unknown-type rules
      # (pyrightconfig.json). Zero errors, no baseline.
      - run: uv run basedpyright
      # Routine suite in parallel: workers share nothing (each test clones
      # its own database from a migrated template). The multi-phase
      # sim_gate simulations (up to ~7 min each) run nightly instead.
      - run: uv run pytest -n auto

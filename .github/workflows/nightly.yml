name: Nightly simulation gates

# The long multi-phase simulations (sim_gate: seven- and thirty-day runs)
# are too slow for every push; they run here once a night and on demand.
on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

jobs:
  sim-gates:
    timeout-minutes: 45
    runs-on: ubuntu-latest
    services:
      db:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: embervale
          POSTGRES_USER: embervale
          POSTGRES_PASSWORD: ci-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U embervale -d embervale"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Explicit test configuration: never the live provider, never the
      # tracked evidence directories (stage gates write there by default).
      WORLDSIM_DATABASE__URL: postgresql+asyncpg://embervale:ci-only@localhost:5432/embervale
      WORLDSIM_PROVIDER__ACTIVE_PROFILE: fake
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          python-version: "3.12"
          enable-cache: true
      - run: echo "WORLDSIM_EVIDENCE_DIR=$RUNNER_TEMP/evidence" >> "$GITHUB_ENV"
      - run: uv sync --frozen
      - run: uv run pytest -m sim_gate -n auto --durations=15

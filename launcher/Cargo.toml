[package]
name = "ember-vale-launcher"
version = "0.2.0"
edition = "2024"

[dependencies]
chrono = { version = "0.4.42", default-features = false, features = ["clock"] }
fastrand = "2.5.0"
ratatui = "0.30"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sysinfo = { version = "0.39", default-features = false, features = ["system"] }
toml = "1.1.6"

# Small, self-contained release binaries for players.
[profile.release]
lto = true
codegen-units = 1
strip = true
